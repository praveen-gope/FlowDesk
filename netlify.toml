[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8889
  framework = "#custom"

[[redirects]]
  from = "/sign-in"
  to = "/html/sign-in.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/sign-in"
  status = 302

[[redirects]]
  from = "/html/sign-in.html"
  to = "/sign-in"
  status = 301
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
