<!DOCTYPE html>
<html lang="en">
<head>

  <title>FlowDesk CRM - Add task</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="Add task">
{% include "html/menu.html" %}
<main><header><h1 id="ti">Add task</h1><div class="bar" style="margin:0"><button class="b ic">🔔</button><select class="b" id="th"><option value="system">◐ System</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option></select></div></header><div id="v">

<div class="card" style="max-width:760px">
<h3>Add task</h3>
<div class="g" style="grid-template-columns:1fr 1fr">
<div>
<label>Task name</label>
<input class="in" style="width:100%" type="text" value="" placeholder="Task name">
</div>
<div>
<label>Category</label>
<input class="in" style="width:100%" type="text" value="" placeholder="Category">
</div>
<div>
<label>Due date</label>

</div>
<div>
<label>Team</label>
<input class="in" style="width:100%" type="text" value="" placeholder="Team">
</div>
<div>
<label>Assignee</label>
<input class="in" style="width:100%" type="text" value="" placeholder="Assignee">
</div>
<div>
<label>Status</label>
<input class="in" style="width:100%" type="text" value="" placeholder="Status">
</div>
</div>
<br>
<button class="b p" onclick="history.back()">Save</button> <button class="b" onclick="history.back()">Cancel</button>

</div></main>
