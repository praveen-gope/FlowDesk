<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlowDesk CRM - Users & Teams</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="Users & Teams">
{% include "html/menu.html" %}
<main><header><h1 id="ti">Users & Teams</h1><div class="bar" style="margin:0"><button class="b ic">🔔</button><select class="b" id="th"><option value="system">◐ System</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option></select></div></header><div id="v">
<h2>Users &amp; Teams</h2>
<div class="g g2">
<form id="user-form" class="card"><h3>Create user</h3>
<label for="user-name">Full name</label><input class="in" id="user-name" name="name" required maxlength="150" style="width:100%">
<label for="user-email">Email</label><input class="in" id="user-email" name="email" type="email" required style="width:100%">
<label for="user-password">Initial password</label><input class="in" id="user-password" name="password" type="password" required minlength="8" autocomplete="new-password" style="width:100%">
<label for="user-role">Role</label><select class="in" id="user-role" name="role" style="width:100%"></select>
<label for="user-team">Team</label><select class="in" id="user-team" name="team" style="width:100%"></select>
<p><button class="b p" type="submit">Create user</button></p></form>
<form id="team-form" class="card"><h3>Create team</h3><label for="team-name">Team name</label><input class="in" id="team-name" name="name" required maxlength="120" style="width:100%"><p><button class="b p" type="submit">Create team</button></p></form>
</div>
<h3>Accounts</h3><div class="card tw"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Teams</th><th>Status</th><th>Action</th></tr></thead><tbody id="user-rows"></tbody></table></div>
</div></main>
<script src="../javascript/app.js"></script>
<script src="../javascript/backend.js"></script>

</body>
</html>
