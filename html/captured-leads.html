<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlowDesk CRM - Captured Leads</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="Captured Leads">
{% include "html/menu.html" %}
<main><header><h1 id="ti">Captured Leads</h1><div class="bar" style="margin:0"><button class="b ic">🔔</button><select class="b" id="th"><option value="system">◐ System</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option></select></div></header><div id="v">
<div class="bar" style="justify-content:space-between;align-items:center">
  <h2 style="margin:0">Captured Leads <span id="lead-count">0</span></h2>
  <div class="bar" style="margin:0"><a class="b" href="lead-form.html" style="text-decoration:none">Website form</a><button class="b" id="lead-refresh">Refresh</button></div>
</div>
<div class="bar"><input class="in" id="lead-search" aria-label="Search captured leads" placeholder="Search name, email, company or source"></div>
<p class="mu" id="lead-status" role="status">Connecting...</p>
<div class="card tw"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Company</th><th>Source</th><th>Message</th><th>Status</th><th>Captured at</th></tr></thead><tbody id="lead-rows"></tbody></table></div>
<p class="mu" id="lead-empty">No leads found.</p>
</div></main>
<script src="../javascript/app.js"></script>
<script src="../javascript/backend.js"></script>
<script src="../javascript/leads.js"></script>
</body>
</html>
