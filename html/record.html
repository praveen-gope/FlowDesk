<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FlowDesk CRM - Record</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-page="Record">
{% include "html/menu.html" %}
<main><header><h1 id="ti">Record</h1><div class="bar" style="margin:0"><button class="b ic">🔔</button><select class="b" id="th"><option value="system">◐ System</option><option value="light">☀ Light</option><option value="dark">☾ Dark</option></select></div></header><div id="v">
<h2 id="record-name">Record</h2><form class="card" id="record-form" style="max-width:760px">
<label for="record-title">Name</label><input class="in" id="record-title" name="name" required style="width:100%">
<label for="record-email">Email</label><input class="in" id="record-email" name="email" type="email" style="width:100%">
<label for="record-phone">Phone</label><input class="in" id="record-phone" name="phone" style="width:100%">
<label for="record-company">Company</label><input class="in" id="record-company" name="company" style="width:100%">
<label for="record-status">Status</label><input class="in" id="record-status" name="status" style="width:100%">
<label for="record-message">Message</label><textarea class="in" id="record-message" name="message" style="width:100%;min-height:160px"></textarea>
<p><button class="b p" type="submit">Save changes</button></p></form>
</div></main>
<script src="../javascript/app.js"></script>
<script src="../javascript/backend.js"></script>

</body>
</html>
