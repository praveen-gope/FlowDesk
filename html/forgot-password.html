<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password | FlowDesk</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/public.css">
</head>
<body class="auth-page" data-page="Forgot password">
  <main class="auth-main">
    <div class="auth-panel">
      <div class="auth-brand">FlowDesk</div>
      <h1>Reset your password</h1>
      <p class="mu">Receive a secure reset link for your workspace account.</p>
      <form id="recovery-form">
        <label for="recovery-email">Email address</label>
        <input class="in" id="recovery-email" name="email" type="email" autocomplete="username" required>
        <button class="b p auth-submit" type="submit">Send reset link</button>
        <p id="recovery-status" class="auth-status" role="status" aria-live="polite"></p>
      </form>
      <p><a href="/sign-in">Back to sign in</a></p>
    </div>
  </main>
  <script type="module" src="../javascript/password-recovery.js"></script>
</body>
</html>
